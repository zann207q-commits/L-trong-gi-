
name: ACCollector Auto Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Auto Unzip And Build
    runs-on: ubuntu-latest

    steps:

      # STEP 1: Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Install Java 21 (NO GRADLE CACHE)
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # STEP 3: Automatically extract every ZIP
      - name: Auto Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _autobuild/unpacked artifacts

          python3 <<'PY'
          import os
          import zipfile

          root = os.getcwd()
          output = os.path.join(root, "_autobuild/unpacked")

          archives = []

          for current, dirs, files in os.walk(root):
              dirs[:] = [
                  d for d in dirs
                  if d not in (
                      ".git", ".gradle",
                      "_autobuild", "artifacts"
                  )
              ]

              for filename in files:
                  if filename.lower().endswith(".zip"):
                      archives.append(
                          os.path.join(current, filename)
                      )

          archives.sort()

          if not archives:
              print("No ZIP found. Searching repository directly.")

          for i, archive in enumerate(archives):
              destination = os.path.join(
                  output, f"archive_{i:03d}"
              )

              os.makedirs(destination, exist_ok=True)

              print(f"Extracting: {archive}")

              with zipfile.ZipFile(archive) as z:
                  base = os.path.realpath(destination)

                  for item in z.infolist():
                      target = os.path.realpath(
                          os.path.join(destination, item.filename)
                      )

                      if os.path.commonpath(
                          [base, target]
                      ) != base:
                          raise RuntimeError(
                              "Unsafe ZIP path: " + item.filename
                          )

                  z.extractall(destination)

          print("All ZIP files extracted.")
          PY

      # STEP 4: Find all Gradle project roots
      - name: Auto Detect Gradle Projects
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os

          root = os.getcwd()
          ignored = {
              ".git", ".gradle", "build",
              "artifacts", "_autobuild"
          }

          candidates = set()

          for current, dirs, files in os.walk(root):
              dirs[:] = [d for d in dirs if d not in ignored]

              if (
                  "build.gradle" in files
                  or "build.gradle.kts" in files
              ):
                  candidates.add(os.path.realpath(current))

          # Remove nested Gradle subprojects when a parent
          # already contains the root build file.
          projects = []

          for path in sorted(candidates, key=len):
              if not any(
                  path.startswith(parent + os.sep)
                  for parent in projects
              ):
                  projects.append(path)

          if not projects:
              raise SystemExit(
                  "ERROR: No build.gradle or build.gradle.kts found."
              )

          os.makedirs("_autobuild", exist_ok=True)

          with open("_autobuild/projects.txt", "w") as f:
              for path in projects:
                  print("FOUND:", path)
                  f.write(path + "\n")

          print("Total projects:", len(projects))
          PY

      # STEP 5: Install Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      # STEP 6: Verify build environment
      - name: Check Build Environment
        shell: bash
        run: |
          java -version
          gradle --version

      # STEP 7: Build all detected projects
      - name: Auto Build
        shell: bash
        run: |
          set -euo pipefail

          INDEX=0

          while IFS= read -r PROJECT_DIR; do
            [ -n "$PROJECT_DIR" ] || continue

            INDEX=$((INDEX + 1))

            echo "=================================="
            echo "BUILD PROJECT $INDEX"
            echo "PROJECT: $PROJECT_DIR"
            echo "=================================="

            cd "$PROJECT_DIR"

            if [ -f "./gradlew" ]; then
              echo "Using project Gradle Wrapper"
              chmod +x ./gradlew
              ./gradlew clean build --no-daemon --stacktrace
            else
              echo "Using installed Gradle"
              gradle clean build --no-daemon --stacktrace
            fi

            cd "$GITHUB_WORKSPACE"

            echo "PROJECT $INDEX BUILD SUCCESS"

          done < _autobuild/projects.txt

      # STEP 8: Find and collect generated JAR files
      - name: Collect JAR Files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          INDEX=0

          while IFS= read -r PROJECT_DIR; do
            [ -n "$PROJECT_DIR" ] || continue

            while IFS= read -r -d '' JAR; do
              NAME=$(basename "$JAR")

              case "$NAME" in
                *-sources.jar|*-javadoc.jar)
                  echo "Skipping: $NAME"
                  continue
                  ;;
              esac

              INDEX=$((INDEX + 1))

              cp "$JAR" "artifacts/${INDEX}_${NAME}"

              echo "Collected: $NAME"

            done < <(
              find "$PROJECT_DIR" \
                -type f \
                -path "*/build/libs/*.jar" \
                -print0
            )

          done < _autobuild/projects.txt

          if [ "$INDEX" -eq 0 ]; then
            echo "ERROR: No JAR generated!"
            exit 1
          fi

          echo "=================================="
          echo "TOTAL JAR: $INDEX"
          ls -lh artifacts/
          echo "=================================="

      # STEP 9: Upload all JAR files
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ACCollector-Build
          path: artifacts/*.jar
          if-no-files-found: error
          retention-days: 14
