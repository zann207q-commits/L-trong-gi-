name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o ACCollectorV8-meteor-src.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Zip không có gradlew -> dùng Gradle cài sẵn thay vì ./gradlew
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        working-directory: acv8
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ACCollectorV8
          path: acv8/build/libs/*.jar
