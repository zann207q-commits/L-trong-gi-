name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          # Tự tìm file zip trong repo, không phụ thuộc tên chính xác
          ZIP=$(find . -maxdepth 2 -iname 'ACCollectorV8*.zip' -not -path './.git/*' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy file ACCollectorV8*.zip trong repo. File hiện có:"
            ls -la
            exit 1
          fi
          echo "Dùng file: $ZIP"
          mkdir -p src_build
          unzip -q -o "$ZIP" -d src_build
          # zip có thư mục gốc acv8/ -> tìm thư mục chứa build.gradle
          PROJ=$(dirname "$(find src_build -name build.gradle -not -path '*/node_modules/*' | head -n 1)")
          echo "PROJECT_DIR=$PROJ" >> "$GITHUB_ENV"
          echo "Project dir: $PROJ"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ACCollectorV8
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
