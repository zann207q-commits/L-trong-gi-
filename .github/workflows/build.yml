name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build from zip
        run: |
          mkdir work
          unzip -q ./*.zip -d work
          cd "$(dirname "$(find work -name gradlew | head -1)")"
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: astrix-debug
          path: work/**/build/libs/astrix-debug-*.jar
