name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q kaze-krispy-donut-finding-with-lucky-finder.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: kaze_work

      - name: Build
        working-directory: kaze_work
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: kaze-jar
          path: kaze_work/build/libs/*.jar
