name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Error: không tìm thấy file .zip trong repo"; ls -la; exit 1
          fi
          echo "Using $ZIP"
          mkdir -p project
          unzip -q -o "$ZIP" -d project
          # Nếu zip có 1 thư mục bọc ngoài thì đi vào trong
          if [ ! -f project/build.gradle ]; then
            INNER=$(dirname "$(find project -maxdepth 3 -name build.gradle | head -n 1)")
            [ -n "$INNER" ] && cp -a "$INNER"/. project/
          fi
          chmod +x project/gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: project
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kingmc-raidkit
          path: project/build/libs/*.jar
