name: Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unzip and locate project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n1)
          if [ -n "$ZIP" ]; then
            echo "Unzipping: $ZIP"
            rm -rf _src && mkdir _src
            unzip -q -o "$ZIP" -d _src
            SRC=_src
          else
            SRC=.
          fi
          GW=$(find "$SRC" -name gradlew -not -path '*/.git/*' | head -n1)
          if [ -z "$GW" ]; then echo "::error::gradlew not found"; exit 1; fi
          DIR=$(cd "$(dirname "$GW")" && pwd)
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          chmod +x "$DIR/gradlew"
          mkdir -p "$GITHUB_WORKSPACE/out/normal" "$GITHUB_WORKSPACE/out/obf"

      - name: Detect obfuscation task
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          TASK=$(./gradlew tasks --all --no-daemon -q 2>/dev/null \
            | awk '{print $1}' \
            | grep -iE '^(obf|obfuscat|qprotect|proguard)' | head -n1 || true)
          echo "OBF_TASK=$TASK" >> "$GITHUB_ENV"
          echo "Obf task: '${TASK:-none}'"

      - name: Build normal
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          if [ -n "$OBF_TASK" ]; then
            ./gradlew build -x test -x "$OBF_TASK" --no-daemon --stacktrace
          else
            ./gradlew build -x test --no-daemon --stacktrace
          fi
          find build -name '*.jar' \
            ! -name '*-sources*' ! -name '*-dev*' ! -name '*-javadoc*' \
            ! -path '*/tmp/*' -exec cp -v {} "$GITHUB_WORKSPACE/out/normal/" \;

      - name: Build obf
        if: env.OBF_TASK != ''
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e
          rm -rf build/libs
          ./gradlew "$OBF_TASK" -x test --no-daemon --stacktrace
          find build -name '*.jar' \
            ! -name '*-sources*' ! -name '*-dev*' ! -name '*-javadoc*' \
            ! -path '*/tmp/*' -exec cp -v {} "$GITHUB_WORKSPACE/out/obf/" \;

      - name: Warn if no obf task
        if: env.OBF_TASK == ''
        run: echo "::warning::No obf task found. Check that the qProtect plugin is applied in build.gradle."

      - uses: actions/upload-artifact@v4
        with:
          name: normal
          path: out/normal/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: env.OBF_TASK != ''
        with:
          name: obf
          path: out/obf/*.jar
          if-no-files-found: error
